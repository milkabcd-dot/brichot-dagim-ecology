<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חידון: נוף עוטף בית ספר – בריכות הדגים</title>
<style>
:root{--bg:#f6f8f4;--card:#fff;--tx:#1f2d24;--mu:#5d6b62;--ac:#2f7d5b;--bd:#cfd9d2;--ok:#d7f0de;--okb:#2e9e57;--no:#fbdcdc;--nob:#d04a4a;--chip:#e6f1ea}
@media(prefers-color-scheme:dark){:root{--bg:#141a16;--card:#1e2721;--tx:#e8efe9;--mu:#a2b1a7;--ac:#5cc596;--bd:#37463c;--ok:#1f4a2e;--okb:#4cc77a;--no:#4d2323;--nob:#ee7777;--chip:#2a3a30}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Heebo,Arial,sans-serif;line-height:1.6}
header,main,footer{max-width:900px;margin:0 auto;padding:16px}
h1{margin:.2em 0;color:var(--ac)}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:18px 0}
h2{margin:0 0 4px;font-size:1.25rem}
.ins{color:var(--mu);margin:0 0 12px}
.pool,.zone{min-height:44px;border:2px dashed var(--bd);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pool{margin:10px 0}
.zone.cap{min-width:150px;justify-content:center}
.chip{background:var(--chip);border:1px solid var(--ac);border-radius:18px;padding:4px 12px;cursor:grab;user-select:none}
.chip.sel{outline:3px solid var(--ac)}
.ok{background:var(--ok)!important;border-color:var(--okb)!important}
.no{background:var(--no)!important;border-color:var(--nob)!important}
.tree{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;text-align:center}
.tree .top{grid-column:1/3;justify-self:center}
.lbl{color:var(--mu);font-size:.9rem}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.baskets b{display:block;margin-bottom:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:10px}
.card{border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.card img{max-width:100%;height:120px;object-fit:contain}
.ph{height:120px;display:flex;align-items:center;justify-content:center;border:2px dashed var(--bd);color:var(--mu);font-size:.8rem;direction:ltr}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
select{font:inherit;padding:3px 6px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 18px;cursor:pointer;margin:10px 6px 0 0}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.fb{display:inline-block;margin-inline-start:8px;font-weight:700}
label.o{display:inline-block;margin:2px 8px;padding:2px 8px;border-radius:8px;border:1px solid transparent}
#total{position:sticky;bottom:0;background:var(--ac);color:#fff;text-align:center;padding:10px;font-weight:700}
figure{margin:18px 0;text-align:center}figure img{max-width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff}figcaption{color:var(--mu);font-size:.9rem}
footer{text-align:center;color:var(--mu)}
</style>
</head>
<body>
<header>
<h1>🦆 נוף עוטף בית ספר – בריכות הדגים ועופות המים</h1>
<p>חידון מקוון. גררו את המילים למקום הנכון (במסך מגע: לחצו על מילה ואז על המקום), ולחצו "בדיקה".</p>
<p><b>© מילכה ברקו גרש</b></p>
</header>
<main id="m"></main>
<div id="total">ציון: –</div>
<footer>© מילכה ברקו גרש · עבודה נעימה!</footer>
<script>
/* ===== נתונים. אפשר לערוך כאן טקסטים ותשובות ===== */
const BEAKS=[ // [קובץ תמונה, שם העוף, מספר ההסבר, הסבר]
 ["beak-pelican.png","שקנאי",1,"מקור ארוך, קצהו מחודד, קרום גרון אלסטי, ניזון מדגים"],
 ["beak-kharatomit.png","חרטומית",2,"מקור עדין – חיטוט ונעיצת המקור בבוץ לחיפוש הטרף"],
 ["beak-duck.png","ברווז",3,"מקור שטוח ורחב ובשוליו שיניים קרניות – יחד עם הלשון מסנן זרעים, עלים, תולעים וסרטנים"],
 ["beak-kafan.png","כפן",4,"מקור דמוי כף – מזון: סרטנים, רכיכות, תולעים, חרקי מים, דגיגים קטנים, זרעים של צמחי מים"],
 ["beak-sayfan.png","סייפן",5,"מקור נטוי כלפי מעלה, \"קוצר את מזונו\" בתנועות ראש מצד לצד – ניזון מחרקים, סרטנים ותולעים"],
 ["beak-flamingo.png","פלמינגו",6,"סינון חלקיקים מהמים"],
 ["beak-cormorant.png","קורמורן",7,"מקור ארוך ומעוקם בחדות בסופו – אוכל דגים ואפילו נחשי מים"]];
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const chips=(l)=>l.map(([k,t])=>`<span class="chip" draggable="true" data-z="${k}">${t}</span>`).join('');
const zone=(z,cap=1,extra='')=>`<div class="zone ${cap?'cap':''}" data-zone="${z}" data-cap="${cap}">${extra}</div>`;
const sel=(a,opts)=>`<select data-a="${a}"><option value="">בחרו…</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`;
const mc=(name,a,opts)=>opts.map(o=>`<label class="o"><input type="radio" name="${name}" value="${o}" data-a="${a}"> ${o}</label>`).join('');
const S=[];
/* 1 */
S.push({t:"תרשים זרימה 1: נוף עוטף בית ספר",i:"שבצו את המילים מ\"בנק המילים\" בתרשים. אפשר למקם את שני סוגי בתי הגידול בכל צד, והדוגמה שמתחת לכל אחד צריכה להתאים לו.",
 h:`<div class="pool">${chips(shuf([["top","נוף עוטף בית ספר"],["nat","בתי גידול טבעיים"],["art","בתי גידול מלאכותיים"],["stream","נחל תנינים"],["pond","בריכות דגים"]]))}</div>
 <div class="tree"><div class="top">${zone('top')}</div><div class="lbl">כולל</div><div class="lbl">כולל</div>
 <div>${zone('m1')}</div><div>${zone('m2')}</div><div class="lbl">כמו</div><div class="lbl">כמו</div><div>${zone('l1')}</div><div>${zone('l2')}</div></div>
 <p class="row">בין בתי גידול טבעיים למלאכותיים ההשפעה היא: ${mc('q1a','הדדית',['הדדית','חד-כיוונית'])}</p>
 <p class="row">בין נחל תנינים לבריכות דגים ההשפעה היא: ${mc('q1b','הדדית',['הדדית','חד-כיוונית'])}</p>`});
/* 2 */
S.push({pre:`<figure><img src="images/diagram-2.jpg" alt="תרשים זרימה 2: בריכות דגים – היבט אקולוגי" onerror="this.outerHTML='<div class=ph>images/diagram-2.jpg</div>'"><figcaption>תרשים זרימה 2 – בריכות דגים: היבט אקולוגי</figcaption></figure>`,t:"תרשים זרימה 2: בריכות דגים – היבט אקולוגי",i:"מיינו כל גורם: האם הוא גורם אביוטי או ביוטי?",
 h:`<div class="pool">${chips(shuf([["ab","עומק המים"],["ab","ריכוז החמצן"],["ab","שיפוע הגדות"],["bi","צמחיית הגדה"],["bi","צפיפות הדגים"],["bi","מספר ומגוון העופות"]]))}</div>
 <div class="baskets"><div><b>גורמים אביוטיים</b>${zone('ab',0)}</div><div><b>גורמים ביוטיים</b>${zone('bi',0)}</div></div>
 <p class="row">גורמים ביוטיים הם: ${mc('q2','גורמים חיים',['גורמים חיים','גורמים דוממים'])}</p>
 <h3>החיצים המקווקווים: מי משפיע על מי?</h3>
 <p class="ins">בתרשים, הגורמים יכולים להשפיע זה על זה. בחרו לכל זוג את סוג ההשפעה.</p>
 ${shuf([["שיפוע הגדות","ריכוז החמצן",1],["עומק המים","ריכוז החמצן",1],["ריכוז החמצן","צפיפות הדגים",0],["צפיפות הדגים","מספר ומגוון העופות",0],["מספר ומגוון העופות","צמחיית הגדה",0],["שיפוע הגדות","צמחיית הגדה",0],["שיפוע הגדות","מספר ומגוון העופות",1],["עומק המים","מספר ומגוון העופות",1]]).map(([A,B,o])=>`<div class="row"><span>בין <b>${A}</b> לבין <b>${B}</b>:</span>${sel(o?`${A} משפיע על ${B}`:'השפעה הדדית',[`${A} משפיע על ${B}`,`${B} משפיע על ${A}`,'השפעה הדדית'])}</div>`).join('')}`});
/* 3 */
S.push({t:"תרשים זרימה 3: תצפית עופות בבריכות הדגים",i:"עופות ניתן למיין לפי מבנה גוף, סוג המזון ושהות בארץ. מיינו כל מילה לקבוצה המתאימה.",
 h:`<div class="pool">${chips(shuf([["body","מקור"],["body","צוואר"],["body","צבע הגוף"],["body","רגליים"],["body","גודל הגוף"],["body","סימנים מיוחדים"],["food","פגרי דגים"],["food","חסרי חוליות קטנים"],["food","דגים ודגיגונים"],["food","פלנקטון"],["food","מזון צמחי"],["stay","חולפות"],["stay","חורפות"],["stay","מקייצות"],["stay","יציבות"]]))}</div>
 <div class="baskets" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))"><div><b>מבנה גוף</b>${zone('body',0)}</div><div><b>סוג המזון</b>${zone('food',0)}</div><div><b>שהות בארץ</b>${zone('stay',0)}</div></div>`});
/* 4 */
S.push({t:"תרשים 4: התאמת מבנה לתפקיד – מקור",i:"א. גררו את שם העוף אל התמונה שלו. ב. התאימו לכל עוף את ההסבר המתאים.",
 h:`<div class="pool">${chips(shuf(BEAKS.map(b=>[b[1],b[1]])))}</div>
 <div class="cards">${BEAKS.map(b=>`<div class="card"><img src="images/${b[0]}" alt="מקור של ${b[1]}" onerror="this.outerHTML='<div class=ph>images/${b[0]}</div>'">${zone(b[1])}</div>`).join('')}</div>
 <h3>ב. התאמת הסבר</h3>${shuf(BEAKS).map(b=>`<div class="row"><span>${b[3]} ←</span>${sel(b[1],BEAKS.map(x=>x[1]))}</div>`).join('')}`,
 ck:'beak'});
/* 5 */
S.push({t:"דף עבודה 5: אוכלי דגים – התאמת מבנה ותפקיד",i:"השלימו את החסר ובחרו את התשובה הנכונה.",
 h:(()=>{const W=["תצפית","המתרחב","מהירה","מתחתם"];return`
 <p>מקור דמוי פגיון: ללוכדי דגים מעמדת ${sel('תצפית',W)} מחוץ למים, בתנועת מקור ${sel('מהירה',W)} וחטופה (אנפה, שלדג).</p>
 <p>מקור דק וצר עם קצה כפוף: ללוכדים את הדגים תוך כדי שחייה, מעל פני המים או ${sel('מתחתם',W)} (קורמורן, מרגון).</p>
 <p>מקור ${sel('המתרחב',W)} לשק גדול – ללכידת דגים, כמו אצל השקנאי.</p>
 <p>מקור רחב עם לוחיות קרניות לסינון, יחד עם הלשון, יש ל… ${mc('ס1','ברווזים',['ברווזים','נשרים','דרורים','סיפנים','חרטומיות'])}</p>
 <p>מקור ${mc('ס2','כפוף',['ישר','כפוף'])} כמו לפלמינגו, שבשוליו לוחיות קרניות, ופועל כמו מחפרון.</p>
 <p><b>סמנו את העופות שניזונים מדגים:</b> ${[["שקנאי",1],["קורמורן",1],["כפן",0],["פלמינגו",0],["ברווז",0],["סייפן",0]].map(([n,c])=>`<label class="o"><input type="checkbox" data-c="${c}"> ${n}</label>`).join('')}</p>`})()});

/* ===== מנוע ===== */
const M=document.getElementById('m');let selected=null;const res={};
S.forEach((s,n)=>{const e=document.createElement('section');e.id='s'+n;
 e.innerHTML=`<h2>${n+1}. ${s.t}</h2><p class="ins">${s.i}</p>${s.pre||''}${s.h}<button>בדיקה</button><button class="g">איפוס</button><span class="fb"></span>`;
 const[b1,b2]=e.querySelectorAll('button');b1.onclick=()=>check(e,n);b2.onclick=()=>reset(e,n);M.append(e)});
function pool(e){return e.querySelector('.pool')}
function put(chip,z){const cap=z.dataset.cap==='1';
 if(cap&&z.querySelector('.chip')){const o=z.querySelector('.chip');(pool(z.closest('section'))).append(o)}
 z.append(chip);chip.classList.remove('sel','ok','no');selected=null}
document.addEventListener('dragstart',e=>{if(e.target.classList?.contains('chip'))selected=e.target});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{const z=e.target.closest('.zone,.pool');if(z&&selected){put(selected,z)}});
document.addEventListener('click',e=>{const c=e.target.closest('.chip');
 if(c){document.querySelectorAll('.chip.sel').forEach(x=>x.classList.remove('sel'));selected=c;c.classList.add('sel');return}
 const z=e.target.closest('.zone,.pool');if(z&&selected)put(selected,z)});
function mark(el,ok){el.classList.remove('ok','no');el.classList.add(ok?'ok':'no')}
function check(e,n){let ok=0,tot=0;
 if(e.id==='s0'){const G=k=>{const c=e.querySelector('[data-zone="'+k+'"] .chip');return c?c.dataset.z:null};
  const pr={nat:'stream',art:'pond'},t=G('top'),m1=G('m1'),m2=G('m2'),l1=G('l1'),l2=G('l2');
  [['top',t==='top'],['m1',m1==='nat'||m1==='art'],['m2',(m2==='nat'||m2==='art')&&m2!==m1],['l1',!!m1&&!!l1&&pr[m1]===l1],['l2',!!m2&&!!l2&&pr[m2]===l2]].forEach(([k,g])=>{const c=e.querySelector('[data-zone="'+k+'"] .chip');if(c){tot++;if(g)ok++;mark(c,g)}})}
 else e.querySelectorAll('.zone').forEach(z=>{const k=z.dataset.zone;z.querySelectorAll('.chip').forEach(c=>{tot++;const g=c.dataset.z===k;if(g)ok++;mark(c,g)})});
 const chipsAll=e.querySelectorAll('.chip');const placed=e.querySelectorAll('.zone .chip').length;
 tot+=chipsAll.length-placed;
 e.querySelectorAll('select').forEach(s=>{tot++;const g=s.value===s.dataset.a;if(g)ok++;mark(s,g)});
 const rg={};e.querySelectorAll('input[type=radio]').forEach(r=>{(rg[r.name]=rg[r.name]||[]).push(r)});
 Object.values(rg).forEach(g=>{tot++;const c=g.find(r=>r.checked);const good=c&&c.value===g[0].dataset.a;if(good)ok++;g.forEach(r=>r.parentElement.classList.remove('ok','no'));if(c)mark(c.parentElement,good)});
 const cb=[...e.querySelectorAll('input[type=checkbox]')];if(cb.length){cb.forEach(x=>{tot++;const g=x.checked===(x.dataset.c==='1');if(g)ok++;if(x.checked)mark(x.parentElement,g)})}
 res[n]=[ok,tot];e.querySelector('.fb').textContent=`${ok} מתוך ${tot}`;upd()}
function reset(e,n){e.querySelectorAll('.zone .chip').forEach(c=>{pool(e).append(c)});
 e.querySelectorAll('.ok,.no').forEach(x=>x.classList.remove('ok','no'));
 e.querySelectorAll('select').forEach(s=>s.value='');e.querySelectorAll('input').forEach(i=>i.checked=false);
 e.querySelector('.fb').textContent='';delete res[n];upd()}
function upd(){let o=0,t=0;Object.values(res).forEach(([a,b])=>{o+=a;t+=b});
 document.getElementById('total').textContent=t?`ציון: ${Math.round(o/t*100)} (${o}/${t}) · נבדקו ${Object.keys(res).length} מתוך ${S.length} חלקים`:'ציון: –'}
</script>
</body>
</html>
